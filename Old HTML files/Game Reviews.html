<div class="container">
    <div class="review-box">
        <h2 class="review-title">Leave a Review</h2>
        
        <form>
    <div class="input-group">
        <label class="input-label">Rating</label>
        <select class="rating-field">
            <option>⭐</option>
            <option>⭐⭐</option>
            <option selected>⭐⭐⭐</option>
            <option>⭐⭐⭐⭐</option>
            <option>⭐⭐⭐⭐⭐</option>
        </select>
        <span class="rating-note">Choose your rating</span>
    </div>

    <div class="input-group">
        <label class="input-label">Would you recommend this game to other players?</label>
        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="recommend" value="yes" checked> Yes
            </label>
            <label class="radio-label">
                <input type="radio" name="recommend" value="no"> No
            </label>
        </div>
    </div>

    <div class="input-group">
        <label class="input-label">Comment</label>
        <textarea class="comment-field" placeholder="Write your suggestion here..."></textarea>
    </div>

    <button type="submit" class="submit-btn">Submit Review</button>
</form>
    </div>
</div>

<footer style="position:fixed; bottom:0; width:100%; text-align:center; padding:15px; background-color:#24222f; border-top:2px solid #4a475e; color:#d1d1e0; font-size:14px;">

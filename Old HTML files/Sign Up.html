<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sign Up | Digital Game Store</title>
<link rel="stylesheet" href="Style/style.css">
</head>

<body>

<div style="display:flex; justify-content:center; align-items:center; min-height:100vh;">
    <div class="card" style="width:500px; margin-bottom:60px;">

        <h1>Create Account</h1>

        <form>
            <label>Username</label>
            <input type="text" placeholder="Enter username">

            <label>Email</label>
            <input type="email" placeholder="Enter email">

            <label>Password</label>
            <input type="password" placeholder="Enter password">

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm password">

            <a href="store.html" class="btn" style="display:block; margin:20px auto 0; width:fit-content;">Sign Up</a>
        </form>

        <div class="login-link">
            <p>Already have an account? <a href="Login.html">Login</a></p>
        </div>

    </div>
</div>

<footer>
© 2026 Digital Game Store | All Rights Reserved
</footer>

</body>
</html>
